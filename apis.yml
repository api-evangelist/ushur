aid: ushur
name: Ushur
description: >-
  Ushur is an agentic AI platform for customer experience automation (CXA) in
  regulated industries, including healthcare, insurance, and financial
  services. Enterprises use Ushur Studio, AI Agents, the Invisible App,
  intelligent document automation, and the platform's REST APIs and prebuilt
  integrations to automate end-to-end member, patient, and policyholder
  journeys across SMS, email, voice, and web channels, with HIPAA, HITRUST,
  SOC 2, and PCI DSS compliance built in.
