apis:
- name: Ushur Platform API
  description: REST API for the Ushur customer experience automation platform.
    Documented operations (per the official UshurNodeSDK) include logging in to a
    tenant instance, initiating campaign engagements with end users, retrieving
    detailed and tagged responses for a request, adding, querying, and deleting
    enterprise data, and authenticating end-user phone numbers with OTP
    confirmation. Full API documentation sits behind a login at docs.ushur.com.
